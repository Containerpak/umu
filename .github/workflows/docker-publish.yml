name: Publish

on:
  push:
    branches: ["**"]
  schedule:
    - cron: '30 7 * * 2'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: publish-umu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: identity
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME//\//-}-${{ matrix.arch }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/containerpak/umu:$tag" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/containerpak/umu
          tags: type=raw,value=${{ steps.identity.outputs.tag }}

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: Containerfile
          pull: true
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=umu-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=umu-${{ matrix.arch }}
          provenance: mode=max
          sbom: true

      - name: Verify launcher
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm \
            --entrypoint sh \
            --env EXPECTED_ARCH \
            "$IMAGE" -ceu '
              test "$(dpkg --print-architecture)" = "$EXPECTED_ARCH"
              test -x /usr/local/bin/umu-run
              python3 -m zipfile -t /usr/local/bin/umu-run
            '

      - name: Publish summary
        run: echo "${{ steps.identity.outputs.image }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  index:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: publish
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME//\//-}"
          image="ghcr.io/containerpak/umu:$tag"
          docker buildx imagetools create \
            --tag "$image" \
            --tag "ghcr.io/containerpak/umu:sha-${GITHUB_SHA::7}" \
            "ghcr.io/containerpak/umu:$tag-amd64" \
            "ghcr.io/containerpak/umu:$tag-arm64"
          manifest="$(docker buildx imagetools inspect --raw "$image")"
          jq -e '.manifests[] | select(.platform.architecture == "amd64" and .platform.os == "linux")' <<< "$manifest"
          jq -e '.manifests[] | select(.platform.architecture == "arm64" and .platform.os == "linux")' <<< "$manifest"
          digest="$(docker buildx imagetools inspect "$image" | awk '$1 == "Digest:" && digest == "" {digest=$2} END {print digest}')"
          test -n "$digest"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Pin published image
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          repository="$(jq -r '.image | split("@")[0]' cpak.json)"
          jq --arg image "${repository}@${IMAGE_DIGEST}" '.image = $image' cpak.json > cpak.json.next
          mv cpak.json.next cpak.json
          if ! git diff --quiet -- cpak.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cpak.json
            git commit -m "chore: pin published image [skip ci]"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi

      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62
        if: github.ref == 'refs/heads/main'

      - name: Install cpak-sign
        if: github.ref == 'refs/heads/main'
        run: |
          curl -fsSLO https://github.com/Containerpak/cpak/releases/download/v2.10.16/cpak-sign-linux-amd64
          echo 'ef28930705bdbdd04de4ef3724bd2b65f873cec5709964ce657a9b7f7e0a9a4d  cpak-sign-linux-amd64' | sha256sum -c -
          install -Dm755 cpak-sign-linux-amd64 /usr/local/bin/cpak-sign

      - name: Sign the package state
        if: github.ref == 'refs/heads/main'
        env:
          CPAK_REGISTRY_USERNAME: ${{ github.actor }}
          CPAK_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repository="$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          cpak-sign state \
            --origin "github.com/${repository}" \
            --generation "${{ github.run_number }}"
          cosign sign-blob --yes --new-bundle-format=true \
            --bundle cpak-state.sigstore.json cpak-state
          cpak-sign attach --image "ghcr.io/${repository}"

      - name: Publish summary
        run: docker buildx imagetools inspect "${{ steps.publish.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
